<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Test 001</title>
  <meta name="description" content="Minimal test page optimized to score 100 in Lighthouse (Performance, Accessibility, Best Practices, SEO)." />

  <style>
    /* Performance: no external CSS/fonts/assets */
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <!-- Accessibility: Fixes “Document does not have a main landmark” -->
  <main>
    <h1>Hello World!</h1>
    <p>This page is intentionally minimal for Lighthouse 100 scores.</p>
  </main>

  <!-- Performance: DO NOT load the large js/ scripts here.
       This avoids “Reduce unused JavaScript”, “User Timing marks”, and long tasks. -->
</body>
</html>
